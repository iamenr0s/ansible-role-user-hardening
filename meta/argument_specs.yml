---
argument_specs:
  main:
    short_description: >-
      Audit and fix local account hygiene (empty passwords, system shells, home permissions, inactivity lock).
    options:
      linux_hardening_mode:
        type: str
        default: audit
        choices: [audit, remediate]
        description: audit is read-only.
      linux_hardening_confirm_remediation:
        type: bool
        default: false
        description: Must be true before remediate changes anything.
      linux_hardening_profile:
        type: str
        default: cis_level1
        choices: [baseline, cis_level1, cis_level2]
        description: Security profile.
      linux_hardening_backup:
        type: bool
        default: true
        description: Copy /etc/passwd and /etc/shadow before changing accounts.
      linux_hardening_verify:
        type: bool
        default: true
        description: Re-audit after remediation.
      linux_hardening_fail_on_error:
        type: bool
        default: true
        description: Fail the play when audit finds deviations.
      linux_hardening_user_enabled:
        type: bool
        default: true
        description: Run the role.
      linux_hardening_user_exempt:
        type: list
        elements: str
        default: [root, sync, shutdown, halt]
        description: Accounts remediation never changes; the Ansible user is always added.
      linux_hardening_user_lock_empty_passwords:
        type: bool
        default: true
        description: Lock accounts with an empty password.
      linux_hardening_user_fix_system_shells:
        type: bool
        default: true
        description: Give system accounts a non-login shell.
      linux_hardening_user_nologin_shell:
        type: path
        default: /usr/sbin/nologin
        description: Shell assigned to system accounts.
      linux_hardening_user_fix_home_permissions:
        type: bool
        default: true
        description: Remove group-write and other access from interactive users' homes.
      linux_hardening_user_inactive_days:
        type: raw
        default: 30
        description: Default inactivity lock period (useradd -D -f), int; null to leave unmanaged.
      linux_hardening_user_backup_dir:
        type: path
        default: /var/backups/linux-hardening
        description: Where account file backups go.
