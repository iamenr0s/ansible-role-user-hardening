---
- name: audit | Gather account data
  ansible.builtin.include_tasks: facts.yml

- name: audit | Compare with desired state
  ansible.builtin.set_fact:
    linux_hardening_user_findings: >-
      {{ __linux_hardening_user_lists | user_hardening_findings(
           too_open_homes=__linux_hardening_user_open_homes,
           inactive=__linux_hardening_user_inactive,
           inactive_days=linux_hardening_user_inactive_days,
           nologin_shell=linux_hardening_user_nologin_shell,
           lock_empty_passwords=linux_hardening_user_lock_empty_passwords | bool,
           fix_system_shells=linux_hardening_user_fix_system_shells | bool,
           fix_home_permissions=linux_hardening_user_fix_home_permissions | bool) }}

- name: audit | Report user_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_user_findings | length == 0 else linux_hardening_user_findings }}"

# Report-only findings (UID 0, duplicate UIDs, ...) need a human, so they never fail a remediation run.
- name: audit | Fail if remediation left fixable findings
  ansible.builtin.fail:
    msg: >-
      user_hardening could not fix
      {{ linux_hardening_user_findings | selectattr('fixable') | list | length }} deviation(s).
  when:
    - __linux_hardening_user_audit_fatal | default(false)
    - linux_hardening_user_findings | selectattr('fixable') | list | length > 0

- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "user_hardening found {{ linux_hardening_user_findings | length }} deviation(s)."
  when:
    - not (__linux_hardening_user_audit_fatal | default(false))
    - linux_hardening_fail_on_error | bool
    - linux_hardening_user_findings | length > 0
