---
- name: audit | Gather account data
  ansible.builtin.include_tasks: facts.yml

- name: audit | Compare with desired state
  ansible.builtin.set_fact:
    linux_hardening_user_findings: >-
      {{ __lh_user_lists | user_hardening_findings(
           too_open_homes=__lh_user_open_homes,
           inactive=__lh_user_inactive,
           inactive_days=linux_hardening_user_inactive_days,
           nologin_shell=linux_hardening_user_nologin_shell,
           lock_empty_passwords=linux_hardening_user_lock_empty_passwords | bool,
           fix_system_shells=linux_hardening_user_fix_system_shells | bool,
           fix_home_permissions=linux_hardening_user_fix_home_permissions | bool) }}

- name: audit | Report user_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_user_findings | length == 0 else linux_hardening_user_findings }}"

# After remediation only fixable findings fail the run; the others need a human.
- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "user_hardening found {{ __lh_user_blocking | length }} deviation(s)."
  vars:
    __lh_user_blocking: >-
      {{ linux_hardening_user_findings | selectattr('fixable') | list
         if __lh_user_audit_fatal | default(false) else linux_hardening_user_findings }}
  when:
    - __lh_user_blocking | length > 0
    - (__lh_user_audit_fatal | default(false)) or (linux_hardening_fail_on_error | bool)
