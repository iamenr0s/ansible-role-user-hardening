---
- name: configure | Gather account data
  ansible.builtin.include_tasks: facts.yml

- name: configure | Work out what must change
  ansible.builtin.set_fact:
    __linux_hardening_user_todo_pw: >-
      {{ __linux_hardening_user_lists['empty_password'] if linux_hardening_user_lock_empty_passwords | bool else [] }}
    __linux_hardening_user_todo_shell: >-
      {{ __linux_hardening_user_lists['system_shell'] if linux_hardening_user_fix_system_shells | bool else [] }}
    __linux_hardening_user_todo_home: >-
      {{ __linux_hardening_user_open_homes if linux_hardening_user_fix_home_permissions | bool else [] }}
    # One timestamp for both files, and no dependency on gathered facts.
    __linux_hardening_user_backup_stamp: "{{ now(fmt='%Y%m%dT%H%M%S') }}"

- name: configure | Ensure the backup directory exists
  ansible.builtin.file:
    path: "{{ linux_hardening_user_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: linux_hardening_backup | bool

- name: configure | Back up the account files before changing them
  ansible.builtin.copy:
    src: "/etc/{{ item }}"
    dest: "{{ linux_hardening_user_backup_dir }}/{{ item }}.{{ __linux_hardening_user_backup_stamp }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  loop: [passwd, shadow]
  when:
    - linux_hardening_backup | bool
    - not ansible_check_mode  # the backup dir may not exist yet; nothing changes in check mode anyway
    - (__linux_hardening_user_todo_pw + __linux_hardening_user_todo_shell) | length > 0

- name: configure | Lock accounts with an empty password
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
  loop: "{{ __linux_hardening_user_todo_pw }}"

- name: configure | Give system accounts a non-login shell
  ansible.builtin.user:
    name: "{{ item }}"
    shell: "{{ linux_hardening_user_nologin_shell }}"
  loop: "{{ __linux_hardening_user_todo_shell }}"

- name: configure | Restrict home directory permissions
  ansible.builtin.file:
    path: "{{ item['home'] }}"
    state: directory
    mode: "g-w,o-rwx"
  loop: "{{ __linux_hardening_user_todo_home }}"
  loop_control:
    label: "{{ item['home'] }}"

# The file that useradd -D -f writes; Debian ships the line commented out.
- name: configure | Set the inactivity lock period for new accounts
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: '^#?\s*INACTIVE='
    line: "INACTIVE={{ linux_hardening_user_inactive_days | int }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    backup: "{{ linux_hardening_backup | bool }}"
  when: linux_hardening_user_inactive_days is not none
