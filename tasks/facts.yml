---
# Read-only. Reads the local account files (not LDAP/SSSD) and derives the lists used by audit and configure.
- name: facts | Read /etc/passwd
  ansible.builtin.slurp:
    src: /etc/passwd
  register: __linux_hardening_user_passwd
  check_mode: false

- name: facts | Read /etc/login.defs
  ansible.builtin.slurp:
    src: /etc/login.defs
  register: __linux_hardening_user_login_defs
  check_mode: false

- name: facts | Read /etc/shadow
  ansible.builtin.slurp:
    src: /etc/shadow
  register: __linux_hardening_user_shadow
  check_mode: false
  no_log: true  # password hashes

# No module reports the useradd defaults; read-only, so never changed.
- name: facts | Read the useradd defaults
  ansible.builtin.command: useradd -D
  register: __linux_hardening_user_useradd
  changed_when: false
  check_mode: false

# Only whether a password is empty is kept, never the hash itself (filter_plugins/user_hardening.py).
- name: facts | Parse accounts
  ansible.builtin.set_fact:
    __linux_hardening_user_shadow: null  # drop the /etc/shadow contents from hostvars once parsed
    __linux_hardening_user_db: >-
      {{ __linux_hardening_user_passwd['content'] | b64decode
         | user_hardening_parse_accounts(__linux_hardening_user_shadow['content'] | b64decode,
                                         __linux_hardening_user_login_defs['content'] | b64decode) }}
    __linux_hardening_user_inactive: "{{ __linux_hardening_user_useradd['stdout'] | user_hardening_inactive }}"

- name: facts | Derive offender lists
  ansible.builtin.set_fact:
    __linux_hardening_user_lists: >-
      {{ __linux_hardening_user_db | user_hardening_offenders(linux_hardening_user_exempt
                                                              + ([ansible_user] if ansible_user is defined else [])) }}

- name: facts | Stat interactive users' home directories
  ansible.builtin.stat:
    path: "{{ item['home'] }}"
  loop: "{{ __linux_hardening_user_lists['interactive'] }}"
  loop_control:
    label: "{{ item['name'] }}"
  register: __linux_hardening_user_homes
  check_mode: false

- name: facts | Find home directories that are too open
  ansible.builtin.set_fact:
    __linux_hardening_user_open_homes: "{{ __linux_hardening_user_homes['results'] | user_hardening_open_homes }}"
