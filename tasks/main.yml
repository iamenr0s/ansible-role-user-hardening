---
# audit: read-only comparison. remediate: back up, fix what is safely fixable, re-audit.
# Never changes: UID 0 accounts other than root, duplicate UIDs (reported only).
- name: Run user_hardening
  when: linux_hardening_user_enabled | bool
  block:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - linux_hardening_mode in ['audit', 'remediate']
          # type: raw in argument_specs (int rejects null); a non-integer would otherwise become 0.
          - >-
            linux_hardening_user_inactive_days is none
            or linux_hardening_user_inactive_days | string is match('^-?[0-9]+$')
        fail_msg: >-
          linux_hardening_mode must be 'audit' or 'remediate' (got '{{ linux_hardening_mode }}') and
          linux_hardening_user_inactive_days an integer or null (got '{{ linux_hardening_user_inactive_days }}').
        quiet: true

    - name: Note that linux_hardening_profile does not change this role
      ansible.builtin.debug:
        msg: "user_hardening applies the same checks for every profile (got '{{ linux_hardening_profile }}')."
      when: linux_hardening_profile != 'cis_level1'

    - name: Audit (read-only)
      ansible.builtin.include_tasks: audit.yml
      when: linux_hardening_mode == 'audit'

    - name: Remediate
      when: linux_hardening_mode == 'remediate'
      block:
        - name: Require explicit remediation confirmation
          ansible.builtin.assert:
            that: linux_hardening_confirm_remediation | bool
            fail_msg: >-
              Remediation changes accounts. Set linux_hardening_confirm_remediation: true
              to proceed (run with linux_hardening_mode: audit to preview).
            quiet: true

        - name: Configure
          ansible.builtin.include_tasks: configure.yml

        - name: Verify effective configuration
          ansible.builtin.include_tasks: audit.yml
          vars:
            __linux_hardening_user_audit_fatal: true
          # In check mode nothing was changed, so the re-audit would always fail.
          when:
            - linux_hardening_verify | bool
            - not ansible_check_mode
